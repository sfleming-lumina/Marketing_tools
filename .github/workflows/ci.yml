name: CI

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

env:
  GCP_PROJECT_ID: lumina-lakehouse
  GCP_PROJECT_NUMBER: "502916414508"
  GCP_REGION: us-east1
  DASHBOARD_SERVICE: marketing-decision-tool
  DASHBOARD_IAP_MEMBER: user:luminadata@luminasolar.com
  NOTES_SERVICE: notes-api
  RUNTIME_SERVICE_ACCOUNT: marketing-tools-runtime@lumina-lakehouse.iam.gserviceaccount.com
  DEPLOY_SERVICE_ACCOUNT: marketing-tools-deployer@lumina-lakehouse.iam.gserviceaccount.com
  BUILD_SERVICE_ACCOUNT: marketing-tools-build@lumina-lakehouse.iam.gserviceaccount.com
  WORKLOAD_IDENTITY_PROVIDER: projects/502916414508/locations/global/workloadIdentityPools/github-actions/providers/github-marketing-tools
  NOTES_API_BASE: https://notes-api-6stghdub4a-ue.a.run.app
  DASHBOARD_URL_CANONICAL: https://marketing-decision-tool-6stghdub4a-ue.a.run.app
  DASHBOARD_URL_PROJECT: https://marketing-decision-tool-502916414508.us-east1.run.app
  GOOGLE_OAUTH_CLIENT_ID: 502916414508-601pvi5aan8mlut76ieqe2bkmd5hffr2.apps.googleusercontent.com
  ANTHROPIC_MODEL: claude-sonnet-5

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Verify dashboard rendering
        run: node work/verify_marketing_tool.js

      - name: Verify dashboard notes wiring
        run: node work/verify_dashboard_notes.js

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check dashboard server syntax
        run: |
          python -m pip install --upgrade pip
          python -m pip install "google-cloud-bigquery>=3.25"
          python -m py_compile dashboard_server.py

      - name: Run dashboard data and fallback tests
        run: |
          python -m pip install pytest
          python -m pytest tests/test_ahj_performance.py tests/test_campaign_performance.py tests/test_fallback_insights.py tests/test_marketing_intelligence.py tests/test_marketing_decisions.py -q

      - name: Install notes API dependencies
        working-directory: notes-api
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run notes API tests
        working-directory: notes-api
        run: python -m pytest -q

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Apply governed decision-market mapping
        run: bq --project_id="${GCP_PROJECT_ID}" query --use_legacy_sql=false < lakehouse/20260813_marketing_decision_markets.sql

      - name: Apply marketing funnel analysis views
        run: bq --project_id="${GCP_PROJECT_ID}" query --use_legacy_sql=false < lakehouse/20260728_marketing_funnel_analysis.sql

      - name: Refresh calendar-period marketing activity
        run: bq --project_id="${GCP_PROJECT_ID}" query --use_legacy_sql=false < lakehouse/20260806_marketing_activity_trends.sql

      - name: Validate active lead inventory
        run: |
          bq --project_id="${GCP_PROJECT_ID}" query --use_legacy_sql=false --format=prettyjson \
            "ASSERT (SELECT COUNT(*) FROM \`${GCP_PROJECT_ID}.marketing_tool_ops.rpt_marketing_active_lead_inventory_runtime\`) > 0 AS 'Active lead inventory is empty';
             SELECT
               COUNTIF(is_currently_open AND NOT is_test_record) AS governed_open_leads,
               COUNTIF(is_currently_open AND has_active_campaign AND NOT is_test_record) AS active_campaign_open_leads,
               COUNT(DISTINCT IF(is_currently_open AND has_active_campaign AND NOT is_test_record, campaign_source, NULL)) AS active_campaign_sources,
               COUNT(DISTINCT IF(is_currently_open AND has_active_campaign AND NOT is_test_record, outside_rep_bucket, NULL)) AS outside_assignment_buckets,
               MAX(loaded_at) AS loaded_at
             FROM \`${GCP_PROJECT_ID}.marketing_tool_ops.rpt_marketing_active_lead_inventory_runtime\`"

      - name: Validate active campaign catalog
        run: |
          bq --project_id="${GCP_PROJECT_ID}" query --use_legacy_sql=false --format=prettyjson \
            "ASSERT (SELECT COUNT(*) FROM \`${GCP_PROJECT_ID}.marketing_tool_ops.rpt_marketing_active_campaign_catalog_runtime\` WHERE is_active AND NOT is_test_record) > 2 AS 'Active campaign catalog is unexpectedly small';
             ASSERT (SELECT COUNT(*) FROM \`${GCP_PROJECT_ID}.marketing_tool_ops.rpt_marketing_active_campaign_catalog_runtime\` WHERE REGEXP_CONTAINS(LOWER(campaign_name), r'jonathan\\s+bissell')) = 0 AS 'Excluded Jonathan Bissell campaign remains in catalog';
             SELECT COUNT(*) AS active_campaigns, MAX(loaded_at) AS loaded_at
             FROM \`${GCP_PROJECT_ID}.marketing_tool_ops.rpt_marketing_active_campaign_catalog_runtime\`
             WHERE is_active AND NOT is_test_record"

      - name: Apply notes schema migration
        run: bq --project_id="${GCP_PROJECT_ID}" query --use_legacy_sql=false < notes-api/migrations/20260715_note_target_metadata.sql

      - name: Apply feedback action ledger
        run: bq --project_id="${GCP_PROJECT_ID}" query --use_legacy_sql=false < notes-api/migrations/20260814_feedback_actions.sql

      - name: Apply marketing buyer journey view
        run: bq --project_id="${GCP_PROJECT_ID}" query --use_legacy_sql=false < lakehouse/20260814_marketing_buyer_journey.sql

      - name: Apply marketing decision ledger
        run: bq --project_id="${GCP_PROJECT_ID}" query --use_legacy_sql=false < notes-api/migrations/20260729_marketing_decisions.sql

      - name: Deploy notes API
        run: |
          gcloud run deploy "${NOTES_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --source=notes-api \
            --build-service-account="projects/${GCP_PROJECT_ID}/serviceAccounts/${BUILD_SERVICE_ACCOUNT}" \
            --service-account="${RUNTIME_SERVICE_ACCOUNT}" \
            --set-env-vars="^|^BQ_PROJECT_ID=${GCP_PROJECT_ID}|BQ_DATASET=marketing_tool_ops|BQ_TABLE=dashboard_notes|ALLOWED_ORIGINS=${DASHBOARD_URL_CANONICAL},${DASHBOARD_URL_PROJECT}|GOOGLE_OAUTH_CLIENT_ID=${GOOGLE_OAUTH_CLIENT_ID}|ALLOWED_HOSTED_DOMAIN=luminasolar.com" \
            --quiet

      - name: Deploy dashboard
        run: |
          gcloud run deploy "${DASHBOARD_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --source=. \
            --build-service-account="projects/${GCP_PROJECT_ID}/serviceAccounts/${BUILD_SERVICE_ACCOUNT}" \
            --service-account="${RUNTIME_SERVICE_ACCOUNT}" \
            --set-env-vars="^|^BQ_PROJECT_ID=${GCP_PROJECT_ID}|BQ_DATASET=marketing_tool_ops|BQ_TABLE=dashboard_notes|ANTHROPIC_MODEL=${ANTHROPIC_MODEL}|OFFICIAL_WORKBOOK_ACCESS_SERVICE_ACCOUNT=${RUNTIME_SERVICE_ACCOUNT}" \
            --set-secrets="ANTHROPIC_API_KEY=anthropic-api-key:latest" \
            --no-allow-unauthenticated \
            --quiet

      - name: Keep dashboard protected by IAP
        continue-on-error: true
        run: |
          gcloud run services update "${DASHBOARD_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --iap \
            --quiet
          gcloud run services add-iam-policy-binding "${DASHBOARD_SERVICE}" \
            --project="${GCP_PROJECT_ID}" \
            --region="${GCP_REGION}" \
            --member="serviceAccount:service-${GCP_PROJECT_NUMBER}@gcp-sa-iap.iam.gserviceaccount.com" \
            --role=roles/run.invoker \
            --quiet
          gcloud iap web add-iam-policy-binding \
            --project="${GCP_PROJECT_ID}" \
            --resource-type=cloud-run \
            --service="${DASHBOARD_SERVICE}" \
            --region="${GCP_REGION}" \
            --member="${DASHBOARD_IAP_MEMBER}" \
            --role=roles/iap.httpsResourceAccessor \
            --quiet

  refresh-data:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Apply governed decision-market mapping
        run: bq --project_id="${GCP_PROJECT_ID}" query --use_legacy_sql=false < lakehouse/20260813_marketing_decision_markets.sql

      - name: Refresh cohort runtime tables
        run: bq --project_id="${GCP_PROJECT_ID}" query --use_legacy_sql=false < lakehouse/20260728_marketing_funnel_analysis.sql

      - name: Refresh calendar-period marketing activity
        run: bq --project_id="${GCP_PROJECT_ID}" query --use_legacy_sql=false < lakehouse/20260806_marketing_activity_trends.sql
